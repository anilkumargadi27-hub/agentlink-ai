databases:
  - name: agentlink-db
    databaseName: agentlink_db
    user: agentlink_user
    plan: free

services:
  - type: web
    name: agentlink-ai
    runtime: python
    plan: free
    buildCommand: "npm --prefix client install && npm --prefix client run build && pip install -r requirements.txt"
    startCommand: "python -m server.app.seed_demo && uvicorn server.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: agentlink-db
          property: connectionString
      - key: PUBLIC_ORIGIN
        value: "https://agentlink-ai.onrender.com"
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENT_KEY_PEPPER
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: GEMINI_API_KEY
        sync: false
